<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DukaanSaathi AI</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
    --ink:#1d2547;
    --chalk:#fff8e8;
    --turmeric:#f2a900;
    --chili:#c4352b;
    --leaf:#2c7a4b;
    --card:#fff;
    --line:#e8dcc0;
}

* { box-sizing:border-box; }

body {
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font:17px/1.5 "Noto Sans",system-ui,sans-serif;
    padding-bottom:84px;
}

h1,h2,h3 {
    font-family:"Baloo 2",sans-serif;
    margin:.2em 0;
}

header {
    background:var(--ink);
    color:#fff;
    padding:14px 16px;
}

header h1 {
    font-size:1.5rem;
    margin:0;
}

#mode {
    display:block;
    margin-top:4px;
    font-size:.85rem;
    background:var(--turmeric);
    color:var(--ink);
    padding:4px 10px;
    border-radius:99px;
    width:fit-content;
}

main {
    padding:16px;
    max-width:560px;
    margin:auto;
}

.card {
    background:var(--card);
    border:2px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin:12px 0;
}

label {
    display:block;
    font-weight:600;
    margin-top:10px;
}

input,select,textarea {
    width:100%;
    font:inherit;
    padding:12px;
    border:2px solid var(--line);
    border-radius:10px;
    min-height:48px;
    background:#fff;
    color:var(--ink);
}

button,.btn {
    font:600 1rem "Noto Sans";
    min-height:48px;
    padding:10px 18px;
    border:0;
    border-radius:10px;
    background:var(--ink);
    color:#fff;
    margin:8px 8px 0 0;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

button:disabled {
    opacity:.6;
    cursor:not-allowed;
}

.go {
    background:var(--turmeric);
    color:var(--ink);
}

.bad { background:var(--chili); }
.ok { background:var(--leaf); }

.ghost {
    background:#fff;
    color:var(--ink);
    border:2px solid var(--ink);
}

nav {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:#fff;
    border-top:2px solid var(--line);
}

nav button {
    flex:1;
    margin:0;
    border-radius:0;
    background:#fff;
    color:var(--ink);
    min-height:68px;
    flex-direction:column;
    justify-content:center;
    font-size:.85rem;
}

nav button[aria-current=true] {
    background:var(--turmeric);
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline:3px solid var(--chili);
    outline-offset:2px;
}

#msg {
    position:fixed;
    top:0;
    left:0;
    right:0;
    padding:12px 16px;
    font-weight:600;
    display:none;
    z-index:9;
    color:#fff;
}

.tag {
    font-size:.8rem;
    background:var(--line);
    padding:2px 8px;
    border-radius:99px;
}

.empty {
    text-align:center;
    padding:20px;
    color:#5b6180;
}

.src {
    font-size:.85rem;
    color:#5b6180;
}

textarea {
    min-height:140px;
}

</style>
</head>

<body>

<header>
    <h1>DukaanSaathi AI</h1>
    <span id="mode">Loading...</span>
</header>

<div id="msg" role="alert"></div>

<main id="v"></main>

<nav aria-label="Main">
    <button data-t="home">🏪<span>My shop</span></button>
    <button data-t="products">🧺<span>Products</span></button>
    <button data-t="create">✍️<span>Create</span></button>
    <button data-t="learn">📚<span>Learn</span></button>
</nav>

<script>

const $ = s => document.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));

const TASKS = {
    whatsapp_promo:'WhatsApp message',
    product_description:'Product description',
    festival_offer:'Festival message',
    social_caption:'Social media caption',
    marketing_tips:'Marketing & local SEO tips'
};
const PRODUCT_TASKS = ['whatsapp_promo','product_description','festival_offer','social_caption'];
const LN = { en:'English', hi:'हिन्दी', mr:'मराठी' };

/* ------------------------------------------------------------------
   LOCAL STORAGE  (shop, products and messages live in this browser)
------------------------------------------------------------------ */
const KEY = 'dukaansaathi.v1';
let storageOK = true;

function readStore() {
    const blank = { vendor:null, products:[], camps:[], nextId:1 };
    let raw = null;
    try { raw = localStorage.getItem(KEY); }
    catch (e) { storageOK = false; return blank; }
    if (!raw) return blank;
    try {
        const d = JSON.parse(raw);
        const products = Array.isArray(d.products) ? d.products : [];
        const camps = Array.isArray(d.camps) ? d.camps : [];
        const maxId = Math.max(0, ...products.map(p => +p.id || 0), ...camps.map(c => +c.id || 0));
        return {
            vendor: d.vendor && typeof d.vendor === 'object' ? d.vendor : null,
            products, camps,
            nextId: Math.max(Number.isInteger(d.nextId) ? d.nextId : 1, maxId + 1)
        };
    } catch (e) {
        // corrupted data: keep a copy instead of silently deleting it
        try { localStorage.setItem(KEY + '.corrupt', raw); } catch (_) {}
        return blank;
    }
}

const S = Object.assign(readStore(), {
    tab:'home',
    gen:null,
    editP:null,
    editV:false,
    form:{ task:'whatsapp_promo', product_id:'', festival:'', language:'' }
});

let warned = false;
function persist() {
    try {
        localStorage.setItem(KEY, JSON.stringify({
            vendor:S.vendor, products:S.products, camps:S.camps, nextId:S.nextId
        }));
    } catch (e) {
        storageOK = false;
        if (!warned) {
            warned = true;
            toast('Your browser is blocking saving (private mode?). Data will be lost when you close this page.', true);
        }
    }
}

const newId = () => S.nextId++;

/* ------------------------------------------------------------------ */

function toast(m, bad = false) {
    const e = $('#msg');
    e.textContent = m;
    e.style.background = bad ? '#c4352b' : '#2c7a4b';
    e.style.display = 'block';
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => { e.style.display = 'none'; }, 3500);
}

async function api(p, o = {}) {
    const r = await fetch('/api' + p, {
        headers:{ 'Content-Type':'application/json' },
        method:o.method || 'GET',
        body:o.body ? JSON.stringify(o.body) : undefined
    });

    if (!r.ok) {
        let m = 'Something went wrong. Please try again.';
        try {
            const j = await r.json();
            if (typeof j.detail === 'string') m = j.detail;
            else if (Array.isArray(j.detail)) m = j.detail.map(d => d.msg).join('. ');
            else if (j.message) m = j.message;
        } catch {}
        throw new Error(m);
    }
    if (r.status === 204) return null;
    return r.json();
}

function form(f) { return Object.fromEntries(new FormData(f)); }

function hasBadChars(...vals) {
    return vals.some(v => /[<>]/.test(v || '') || /[\u0000-\u001f]/.test(v || ''));
}

function download(name, text, type) {
    const a = document.createElement('a');
    const u = URL.createObjectURL(new Blob([text], { type }));
    a.href = u;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1500);
}

function downloadProfile() {
    const v = S.vendor;
    const rows = S.products.map(p =>
        `<li>${esc(p.name)} - ₹${+p.price}/${esc(p.unit)}${p.description ? ' (' + esc(p.description) + ')' : ''}</li>`
    ).join('');
    const page = `<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(v.shop_name)}</title>`
        + `<body style="font-family:sans-serif;max-width:480px;margin:auto;padding:16px"><h1>${esc(v.shop_name)}</h1>`
        + `<p>${esc(v.business_type)} · ${esc(v.opening_hours)}</p><p>${esc(v.service_area || '')}</p><p>${esc(v.about || '')}</p>`
        + `<h2>Products</h2><ul>${rows}</ul></body>`;
    download('shop-profile.html', page, 'text/html;charset=utf-8');
}

/* ------------------------------------------------------------------ */

function vForm(v = {}) {
    return `
    <form id="vf">
        <label>Shop name
            <input name="shop_name" required minlength="2" maxlength="80" value="${esc(v.shop_name)}" placeholder="Enter your shop name">
        </label>
        <label>What do you sell?
            <input name="business_type" required minlength="2" maxlength="60" placeholder="Tea stall, vegetables, tailor..." value="${esc(v.business_type)}">
        </label>
        <label>Opening hours
            <input name="opening_hours" required minlength="2" maxlength="60" placeholder="7 AM - 9 PM" value="${esc(v.opening_hours)}">
        </label>
        <label>Language
            <select name="language">
                ${Object.entries(LN).map(([k, n]) => `<option value="${k}" ${v.language == k ? 'selected' : ''}>${n}</option>`).join('')}
            </select>
        </label>
        <label>Area you serve (optional)
            <input name="service_area" maxlength="100" value="${esc(v.service_area)}" placeholder="Enter your area">
        </label>
        <button class="go" type="submit" id="saveShop">Save shop</button>
        ${v.shop_name ? '<button type="button" class="ghost" id="cv">Cancel</button>' : ''}
    </form>`;
}

function home() {
    const v = S.vendor;

    if (!v || S.editV) {
        return `
        <div class="card">
            <h2>${v ? 'Edit your shop' : 'Welcome! Set up your shop'}</h2>
            <p>Enter your shop details to get started with DukaanSaathi AI.</p>
            ${vForm(v || {})}
        </div>`;
    }

    return `
    <div class="card">
        <h2>${esc(v.shop_name)}</h2>
        <p>${esc(v.business_type)} · ${esc(v.opening_hours)}<br>${esc(v.service_area || '')}</p>
        <button id="ev">Edit shop</button>
        <button class="go" id="dp">Download profile</button>
    </div>

    <div class="card">
        <h3>${S.products.length} products · ${S.camps.length} messages</h3>
        <p class="src">${storageOK
            ? 'Saved in this browser only. Clearing browser data or using another phone will not carry it over, so take a backup now and then.'
            : '⚠ Saving is blocked in this browser. Your data will be lost when you close the page.'}</p>
        <button class="ghost" id="bk">Download backup</button>
        <button class="ghost" id="rs">Restore backup</button>
        <input type="file" id="rf" accept="application/json,.json" style="display:none">
    </div>

    <h3>Saved messages</h3>
    ${S.camps.length
        ? S.camps.map(c => `
            <div class="card">
                <span class="tag">${esc(TASKS[c.task] || c.task)} · ${esc(LN[c.language] || c.language)} · ${esc(c.status)}</span>
                <p style="white-space:pre-wrap">${esc(c.text)}</p>
                <button class="ok" data-ap="${c.id}">Approve</button>
                <button class="ghost" data-cp="${c.id}">Copy</button>
                <button class="ghost" data-dl="${c.id}">Download</button>
                <button class="bad" data-dc="${c.id}">Delete</button>
            </div>`).join('')
        : '<div class="empty">No messages yet. Tap Create to write your first one.</div>'}
    `;
}

function products() {
    if (!S.vendor) return '<div class="empty">Set up your shop first.</div>';

    const e = S.products.find(p => p.id == S.editP) || {};

    return `
    <div class="card">
        <h2>${e.id ? 'Edit product' : 'Add a product'}</h2>
        <form id="pf">
            <label>Name
                <input name="name" required maxlength="80" value="${esc(e.name)}">
            </label>
            <label>Price in ₹
                <input name="price" type="number" step="0.5" min="1" max="100000" required inputmode="decimal" value="${esc(e.price)}">
            </label>
            <label>Per (cup, kg, piece...)
                <input name="unit" required maxlength="20" value="${esc(e.unit || 'piece')}">
            </label>
            <label>Note (optional)
                <input name="description" maxlength="300" value="${esc(e.description)}">
            </label>
            <button class="go">Save product</button>
            ${e.id ? '<button type="button" class="ghost" id="cx">Cancel</button>' : ''}
        </form>
    </div>

    ${S.products.length
        ? S.products.map(p => `
            <div class="card">
                <h3>${esc(p.name)} <span class="tag">₹${+p.price}/${esc(p.unit)}</span></h3>
                <p>${esc(p.description || '')}</p>
                <button data-ep="${p.id}">Edit</button>
                <button class="bad" data-dp="${p.id}">Delete</button>
            </div>`).join('')
        : '<div class="empty">No products yet. Add your first one above.</div>'}
    `;
}

function create() {
    if (!S.vendor) return '<div class="empty">Set up your shop first.</div>';

    const g = S.gen;
    const f = S.form;
    const lang = f.language || S.vendor.language || 'en';

    return `
    <div class="card">
        <h2>What do you need?</h2>
        <form id="gf">
            <label>Type
                <select name="task">
                    ${Object.entries(TASKS).map(([k, n]) => `<option value="${k}" ${f.task == k ? 'selected' : ''}>${n}</option>`).join('')}
                </select>
            </label>
            <label>Product
                <select name="product_id">
                    <option value="">Choose...</option>
                    ${S.products.map(p => `<option value="${p.id}" ${f.product_id == p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
                </select>
            </label>
            <label>Festival (for festival message)
                <input name="festival" maxlength="40" placeholder="Diwali, Eid, Ganesh Chaturthi" value="${esc(f.festival)}">
            </label>
            <label>Language
                <select name="language">
                    ${Object.entries(LN).map(([k, n]) => `<option value="${k}" ${lang == k ? 'selected' : ''}>${n}</option>`).join('')}
                </select>
            </label>
            <button class="go" id="gb">Write it for me</button>
        </form>
    </div>

    ${g ? `
        <div class="card">
            <span class="tag">AI SUGGESTION · ${g.source == 'ibm-granite' ? 'IBM Granite' : 'Demo template'}</span>
            <textarea id="gt">${esc(g.text)}</textarea>
            <p class="src">${esc(g.disclaimer)}</p>
            <button class="ok" id="gs">Approve &amp; save</button>
        </div>` : ''}
    `;
}

function learn() {
    return `
        <div class="card" id="upi">Loading...</div>
        <div class="card" id="sch">Loading...</div>
    `;
}

async function lrn() {
    try {
        const [u, s] = await Promise.all([api('/upi-guide'), api('/schemes')]);

        $('#upi').innerHTML = `
            <h2>Get paid by UPI</h2>
            <p><b>⚠ ${esc(u.safety)}</b></p>
            <ol>${u.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;

        $('#sch').innerHTML = `
            <h2>Government schemes</h2>
            <p class="src">Verified: official links only. ${esc(s.note)}</p>
            ${s.items.map(i => `
                <p><b>${esc(i.name)}</b> (${esc(i.for)})<br>${esc(i.summary)}<br>
                <a href="${esc(i.link)}" target="_blank" rel="noopener">Official website</a></p>`).join('')}`;
    } catch (e) {
        $('#upi').textContent = 'Could not load this page. Check your internet and try again.';
        $('#sch').textContent = '';
        toast(e.message, true);
    }
}

function render() {
    document.querySelectorAll('nav button').forEach(b => {
        b.setAttribute('aria-current', b.dataset.t == S.tab);
    });

    $('#v').innerHTML = { home, products, create, learn }[S.tab]();
    bind();
    if (S.tab == 'learn') lrn();
}

/* ------------------------------------------------------------------ */

function bind() {
    document.querySelectorAll('nav button').forEach(b => {
        b.onclick = () => { S.tab = b.dataset.t; render(); scrollTo(0, 0); };
    });

    const on = (s, fn) => { const e = $(s); if (e) e.onclick = fn; };

    // ---- shop form
    if ($('#vf')) {
        $('#vf').onsubmit = e => {
            e.preventDefault();
            const d = form(e.target);
            const vendor = {
                shop_name:d.shop_name.trim(),
                business_type:d.business_type.trim(),
                opening_hours:d.opening_hours.trim(),
                language:d.language || 'en',
                service_area:(d.service_area || '').trim(),
                about:(S.vendor && S.vendor.about) || '',
                is_demo:0
            };

            if (!vendor.shop_name || !vendor.business_type || !vendor.opening_hours) {
                return toast('Please fill in all required fields.', true);
            }
            if (hasBadChars(vendor.shop_name, vendor.business_type, vendor.opening_hours, vendor.service_area)) {
                return toast('Remove special characters like < >', true);
            }

            S.vendor = vendor;
            S.editV = false;
            S.tab = 'home';
            persist();
            render();
            toast('Your shop has been saved!');
        };
    }

    on('#cv', () => { S.editV = false; render(); });
    on('#ev', () => { S.editV = true; render(); scrollTo(0, 0); });
    on('#dp', downloadProfile);

    // ---- backup / restore
    on('#bk', () => {
        download('dukaansaathi-backup.json',
            JSON.stringify({ vendor:S.vendor, products:S.products, camps:S.camps, nextId:S.nextId }, null, 2),
            'application/json');
    });
    on('#rs', () => $('#rf').click());
    if ($('#rf')) {
        $('#rf').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(r.result);
                    if (!d || !Array.isArray(d.products) || !Array.isArray(d.camps)) throw new Error('bad');
                    if (!confirm('Replace the data in this browser with this backup?')) return;
                    S.vendor = d.vendor || null;
                    S.products = d.products;
                    S.camps = d.camps;
                    S.nextId = Math.max(+d.nextId || 1, ...d.products.map(p => +p.id || 0), ...d.camps.map(c => +c.id || 0)) + 1;
                    S.gen = null;
                    persist();
                    render();
                    toast('Backup restored');
                } catch (x) {
                    toast('That file is not a valid DukaanSaathi backup.', true);
                }
            };
            r.readAsText(file);
        };
    }

    // ---- products
    if ($('#pf')) {
        $('#pf').onsubmit = e => {
            e.preventDefault();
            const b = form(e.target);
            const item = {
                name:b.name.trim(),
                price:parseFloat(b.price),
                unit:(b.unit || '').trim() || 'piece',
                description:(b.description || '').trim()
            };

            if (!item.name) return toast('Enter a product name.', true);
            if (!(item.price > 0 && item.price <= 100000)) return toast('Enter a price between 1 and 1,00,000.', true);
            if (hasBadChars(item.name, item.unit, item.description)) return toast('Remove special characters like < >', true);

            if (S.editP) {
                const i = S.products.findIndex(p => p.id == S.editP);
                if (i >= 0) S.products[i] = { ...S.products[i], ...item };
            } else {
                S.products.push({ id:newId(), ...item });
            }

            S.editP = null;
            persist();
            render();
            toast('Product saved');
        };
    }

    on('#cx', () => { S.editP = null; render(); });

    document.querySelectorAll('[data-ep]').forEach(b => {
        b.onclick = () => { S.editP = b.dataset.ep; render(); scrollTo(0, 0); };
    });

    document.querySelectorAll('[data-dp]').forEach(b => {
        b.onclick = () => {
            if (!confirm('Delete this product?')) return;
            S.products = S.products.filter(p => p.id != b.dataset.dp);
            if (S.form.product_id == b.dataset.dp) S.form.product_id = '';
            if (S.editP == b.dataset.dp) S.editP = null;
            persist();
            render();
            toast('Product deleted');
        };
    });

    // ---- create (keep selections when the page redraws)
    if ($('#gf')) {
        const keep = () => { Object.assign(S.form, form($('#gf'))); };
        $('#gf').addEventListener('input', keep);
        $('#gf').addEventListener('change', keep);

        $('#gf').onsubmit = async e => {
            e.preventDefault();
            keep();
            const f = S.form;

            let product = null;
            if (PRODUCT_TASKS.includes(f.task)) {
                const p = S.products.find(x => x.id == f.product_id);
                if (!p) return toast('Choose a product first.', true);
                product = { name:p.name, price:p.price, unit:p.unit, description:p.description || null };
            }

            const v = S.vendor;
            const vendor = {
                shop_name:v.shop_name,
                business_type:v.business_type,
                opening_hours:v.opening_hours,
                language:v.language || 'en',
                service_area:v.service_area || null,
                about:v.about || null
            };

            const btn = $('#gb');
            btn.disabled = true;
            btn.textContent = 'Writing...';

            try {
                const out = await api('/generate', {
                    method:'POST',
                    body:{
                        task:f.task,
                        language:f.language || v.language || 'en',
                        festival:f.festival ? f.festival.trim() : null,
                        vendor, product
                    }
                });
                S.gen = { ...out, product_id: product ? +f.product_id : null };
                render();
            } catch (x) {
                toast(x.message, true);
                btn.disabled = false;
                btn.textContent = 'Write it for me';
            }
        };
    }

    on('#gs', async () => {
        const text = $('#gt').value.trim();
        if (text.length < 5 || text.length > 2000) return toast('Message must be 5 to 2000 characters.', true);
        if (hasBadChars(text.replace(/[\r\n\t]/g, ''))) return toast('Remove special characters like < >', true);

        S.camps.unshift({
            id:newId(),
            task:S.gen.task,
            language:S.gen.language,
            text,
            source:S.gen.source,
            status:'approved',
            product_id:S.gen.product_id,
            created:new Date().toISOString()
        });
        S.gen = null;
        S.tab = 'home';
        persist();
        render();
        toast('Message saved successfully');
    });

    // ---- saved messages
    const cm = id => S.camps.find(c => c.id == id);

    document.querySelectorAll('[data-ap]').forEach(b => {
        b.onclick = () => {
            const c = cm(b.dataset.ap);
            if (c) { c.status = 'approved'; persist(); render(); toast('Message approved'); }
        };
    });

    document.querySelectorAll('[data-dc]').forEach(b => {
        b.onclick = () => {
            if (!confirm('Delete this message?')) return;
            S.camps = S.camps.filter(c => c.id != b.dataset.dc);
            persist();
            render();
            toast('Message deleted');
        };
    });

    document.querySelectorAll('[data-cp]').forEach(b => {
        b.onclick = () => {
            const c = cm(b.dataset.cp);
            if (!c) return;
            navigator.clipboard.writeText(c.text)
                .then(() => toast('Copied successfully'))
                .catch(() => toast('Could not copy message', true));
        };
    });

    document.querySelectorAll('[data-dl]').forEach(b => {
        b.onclick = () => {
            const c = cm(b.dataset.dl);
            if (c) download('message.txt', c.text, 'text/plain;charset=utf-8');
        };
    });
}

   START: show saved data immediately, check AI mode in the background
------------------------------------------------------------------ */
render();

api('/status')
    .then(m => { $('#mode').textContent = m.label || 'DukaanSaathi AI'; })
    .catch(() => { $('#mode').textContent = 'Offline: your shop is saved, AI writing needs internet'; });

</script>
